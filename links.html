<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My invite link · SWIPE RIGHT</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#0c0e15;--app:#161925;--surface:#1f2433;--surface-2:#272e40;--line:rgba(255,255,255,.09);--fg:#f4f5fa;--muted:#9aa1b6;--dim:#6e758c;
  --flame:linear-gradient(135deg,#ff9a3d 0%,#ff5864 52%,#fd267a 100%);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"DM Sans",system-ui,sans-serif;color:var(--fg);
  background:radial-gradient(120% 80% at 50% -10%,rgba(253,38,122,.18),transparent 55%),var(--bg);
  display:flex;justify-content:center;padding:28px 16px}
.wrap{width:100%;max-width:440px}
.logo{display:block;width:78%;max-width:300px;margin:6px auto 22px}
h1{font-family:"Poppins",sans-serif;font-weight:800;font-size:24px;margin:0;text-align:center}
p.sub{color:var(--muted);text-align:center;margin:8px 0 26px;line-height:1.5;font-size:15px}
label{display:block;font-family:"Poppins",sans-serif;font-weight:600;font-size:13px;margin:0 0 8px}
input{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:14px 15px;color:var(--fg);font:inherit;font-size:16px;outline:none}
input:focus{border-color:#ff5864}
.out{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.out .k{font-family:"Poppins",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.out .url{margin-top:6px;font-size:14px;word-break:break-all;color:var(--fg)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:700 15px "Poppins",sans-serif;color:#fff;background:var(--flame);cursor:pointer;text-align:center;text-decoration:none}
.btn.wa{background:#25d366}
.btn.ghost{background:var(--surface-2)}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.lang{display:flex;gap:8px;justify-content:center;margin-top:14px}
.lang button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:600 12.5px "Poppins",sans-serif;cursor:pointer}
.lang button.on{background:#fff;color:#161925;border-color:#fff}
.note{color:var(--dim);font-size:12.5px;text-align:center;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="sr-logo-v3.png" alt="SWIPE RIGHT">
  <h1>Create your invite link</h1>
  <p class="sub">Type your name and share your link. Your guests will see <b>"[your name] invites you to…"</b> when they open the invitation.</p>

  <label for="name">Your name</label>
  <input id="name" maxlength="30" placeholder="e.g. Laura" autocomplete="given-name">

  <div class="out">
    <div class="k">Your link</div>
    <div class="url" id="url">—</div>
    <div class="btns">
      <button class="btn" id="copy" aria-disabled="true">📋 Copy link</button>
      <a class="btn wa" id="wa" target="_blank" rel="noopener" aria-disabled="true">Send via WhatsApp</a>
    </div>
  </div>
  <p class="note">The link works for anyone you send it to. Share it as many times as you like.</p>
</div>
<script>
(function(){
  var base = location.href.replace(/links\.html.*$/, "");
  var name = document.getElementById("name"), out = document.getElementById("url");
  var copy = document.getElementById("copy"), wa = document.getElementById("wa"), lang = "en";
  var MSG = {
    es: function(n, u){ return "¡Hola! Te invito a la premiere de SWIPE RIGHT, la primera serie vertical proyectada en una sala de cine.\nDomingo 13 de diciembre · 7:00 p. m. · Paragon Theaters, Fort Lauderdale (9200 W. State Rd. 84, Davie, FL).\nConfirma aquí: " + u; },
    en: function(n, u){ return "Hi! You're invited to the SWIPE RIGHT premiere, the first-ever vertical series screened in a movie theater!\nSunday, December 13 · 7:00 PM · Paragon Theaters, Fort Lauderdale (9200 W. State Rd. 84, Davie, FL).\nRSVP here: " + u; }
  };
  function link(){ var n = name.value.replace(/\s+/g," ").trim(); return n ? base + "?de=" + encodeURIComponent(n) : ""; }
  function update(){
    var u = link(), on = !!u;
    out.textContent = u || "—";
    copy.setAttribute("aria-disabled", !on); wa.setAttribute("aria-disabled", !on);
    wa.href = on ? "https://wa.me/?text=" + encodeURIComponent(MSG[lang](name.value.trim(), u)) : "#";
  }
  name.addEventListener("input", update);
  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click", function(){
      lang = b.getAttribute("data-l");
      document.querySelectorAll(".lang button").forEach(function(x){ x.classList.toggle("on", x===b); });
      update();
    });
  });
  copy.addEventListener("click", function(){
    var u = link(); if(!u) return;
    function ok(){ copy.textContent = "✅ Copied"; setTimeout(function(){ copy.textContent = "📋 Copy link"; }, 1800); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(ok, function(){ prompt("Copy your link:", u); }); }
    else prompt("Copy your link:", u);
  });
})();
</script>
</body>
</html>
